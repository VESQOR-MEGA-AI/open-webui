name: Deploy to production

# Deploys ghcr.io/<this repo>:main to the production server after the Docker
# image workflow succeeds for a push to main. Can also be run manually.
#
# Required repository secrets:
#   DEPLOY_HOST          server hostname or IP
#   DEPLOY_USER          SSH user (must be able to run docker)
#   DEPLOY_SSH_KEY       private key of a dedicated deploy key pair
# Optional repository secret:
#   DEPLOY_KNOWN_HOSTS   output of `ssh-keyscan -p <port> <host>` (pins the host key;
#                        without it the key is fetched at deploy time)
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   DEPLOY_PATH          REQUIRED: directory on the server containing docker-compose.yaml
#   DEPLOY_SERVICE       compose service name        (default: open-webui)
#   DEPLOY_HEALTH_URL    health URL, from the server (default: http://localhost:3000/health)
#   DEPLOY_SSH_PORT      SSH port                    (default: 22)
#   DEPLOY_KEEP_BACKUPS  data backups to keep        (default: 5)

on:
  workflow_run:
    workflows: ['Create and publish Docker images with specific build args']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Check configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; missing=1; fi
          done
          exit $missing

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS not set; trusting the host key presented now."
            ssh-keyscan -p "$DEPLOY_SSH_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE || 'open-webui' }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'http://localhost:3000/health' }}
          DEPLOY_KEEP_BACKUPS: ${{ vars.DEPLOY_KEEP_BACKUPS || '5' }}
        run: |
          expected_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$(printf '%q ' "$DEPLOY_PATH" "$DEPLOY_SERVICE" "$DEPLOY_HEALTH_URL" "$DEPLOY_KEEP_BACKUPS" "$expected_image")" \
            < scripts/deploy/remote-deploy.sh

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
