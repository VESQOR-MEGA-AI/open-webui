name: vesqor-frontend-build

on:
  push:
    branches: [vesqor]
  # Run the gate regression tests on pull requests too: with the branch
  # ruleset requiring a PR, the test must be able to FAIL the PR before the
  # merge — otherwise a regression is only caught after it is already on the
  # deploy branch. PRs only run the test job (no deploy).
  pull_request:
    branches: [vesqor, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # VQA-202 (2026-09-17): SINGLE AUTHORITATIVE SSO AUDIENCE CONTRACT.
      #
      # The accepted Teams SSO audience is owned by VESQOR-MEGA-AI/vesqor-core:
      #   apps/vesqor-m365-gateway/src/config.ts   (CSV allow-list, fail-closed)
      #   apps/vesqor-m365-gateway/.env.example    (declares the contract)
      #   .github/workflows/deploy-gateway.yml     (sets the Fly secret)
      #
      # This repository is a CONSUMER. It used to write that Fly secret itself, with
      # a hard-coded single `api://` spelling, on every push to `vesqor` — which
      # silently re-broke enterprise Teams sign-in even when vesqor-core was
      # correct. Two sources of truth for one contract.
      #
      # This guard fails the build (and every PR) if a hard-coded literal for that
      # variable ever reappears anywhere in this repository.
      - name: Guard — SSO audience is not the consumer's to set
        run: |
          set -euo pipefail
          VAR='ENTRA_EXPECTED_AUDIENCE'
          hits=$(grep -rnE "${VAR}[[:space:]]*=" .github scripts 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::${VAR} is hard-coded in this repository."
            echo "$hits"
            echo "Ownership: the SSO audience contract lives in VESQOR-MEGA-AI/vesqor-core."
            echo "This repository must CONSUME it, never restate it."
            exit 1
          fi
          echo "OK: no hard-coded literal for that variable in this repository."

      # VESQOR: gate regression tests. These FAIL the build if the signup
      # gates (US-only geo gate, embryo sanctions gate) or the alembic graph
      # regress — the exact failure that silently shipped during the v0.11.1
      # force-push. Runs before the build so a broken gate never deploys.
      - name: Signup gate regression tests
        run: python3 test/test_vesqor_signup_gates.py

      # VESQOR: the other two dependency-free gate scripts. Like the one above
      # they use only the standard library (they assert on source and on the
      # alembic graph), so they need no Python setup and cost seconds.
      # test_vq25_page_wiring.py guards the answer-comparison page's wiring:
      # the admin tab, its i18n keys, that model output is never rendered as
      # raw HTML, and that card state is only written through its module.
      - name: Seal UI regression tests
        run: python3 test/test_vesqor_seal_ui.py

      - name: Answer-comparison page wiring tests
        run: python3 test/test_vq25_page_wiring.py

      # Guards the consent gate (GA4 must stay denied until the visitor
      # accepts) and that every /static asset referenced by src/app.html
      # actually ships in the image. vq25.css was referenced but absent from
      # static/static, so the production image served 404 for it.
      - name: Consent + static asset gate tests
        run: python3 test/test_vesqor_consent_and_static.py

      # Guards the three assistant presets: public read grants (a grantless
      # workspace model is invisible to non-admin roles), a provider-served
      # fallback base model id, and no vendor impersonation in the prompts.
      - name: Three-assistant preset gate tests
        run: python3 test/test_vesqor_three_assistants.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # VESQOR: the frontend unit tests previously ran NOWHERE. `vite build`
      # only proves the code compiles, so a logic regression in the
      # answer-comparison card state (e.g. offering a provider as a judge when
      # it cannot be one) shipped with a green build. Runs before the build to
      # fail fast, and on pull_request too, so a regression is caught before it
      # reaches the deploy branch.
      - name: Frontend unit tests
        run: npm run test:frontend

      - name: Build frontend (no pyodide)
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npx vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vesqor-webui-build
          path: build/
          retention-days: 3

      # The Dockerfile copies the pre-built build/ into the image (vite build
      # OOMs on Fly's build machines). build/ is gitignored but present in the
      # checkout from the build step above — fly deploy uses local files, so
      # the Dockerfile's `COPY build /app/build` picks it up directly.
      - name: Install flyctl
        if: github.event_name == 'push'
        run: |
          curl -sL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deploy to Fly.io (vesqor-chat)
        if: github.event_name == 'push'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -a vesqor-chat --remote-only

  deploy-gateway:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vesqor-core
        uses: actions/checkout@v4
        with:
          repository: VESQOR-MEGA-AI/vesqor-core
          ref: main
          token: ${{ secrets.VESQOR_CORE_PAT }}
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      # VQA-202 (2026-09-17): the "Sync SSO audience secret" step was REMOVED here.
      #
      # It ran a `flyctl secrets set` of that variable to the bare `api://` spelling on
      # every push to this repository, immediately before deploying the gateway. That
      # hard-coded single spelling re-broke enterprise Teams sign-in whenever the
      # gateway's own allow-list was correct — the P0 of 2026-09-15/16, re-armed by
      # an unrelated frontend merge.
      #
      # The audience is owned by vesqor-core (config.ts allow-list + .env.example)
      # and applied by vesqor-core/.github/workflows/deploy-gateway.yml, which is the
      # only workflow allowed to write that secret. The guard in the `build` job fails
      # the build if a literal for it ever reappears in this repository.
      - name: Deploy gateway
        working-directory: apps/vesqor-m365-gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --strategy rolling

  deploy-brain:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vesqor-core
        uses: actions/checkout@v4
        with:
          repository: VESQOR-MEGA-AI/vesqor-core
          ref: main
          token: ${{ secrets.VESQOR_CORE_PAT }}
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Set brain notify env secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NOTIFY_SECRET: ${{ secrets.M365_GATEWAY_NOTIFY_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GA4_SECRET: ${{ secrets.GA4_API_SECRET }}
        run: |
          flyctl secrets set \
            M365_GATEWAY_NOTIFY_URL=https://vesqor-m365-gateway.fly.dev/api/notify \
            M365_GATEWAY_NOTIFY_SECRET="$NOTIFY_SECRET" \
            TELEGRAM_BOT_TOKEN="$TG_BOT_TOKEN" \
            TELEGRAM_CHAT_ID="$TG_CHAT_ID" \
            GA4_API_SECRET="$GA4_SECRET" \
            -a vesqor-brain

      - name: Deploy brain
        working-directory: apps/vesqor-mega-ai
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -a vesqor-brain --remote-only --strategy rolling

  gateway-logs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fetch gateway logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl logs -a vesqor-m365-gateway --no-tail
