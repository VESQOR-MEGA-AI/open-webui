name: vesqor-frontend-build

on:
  push:
    branches: [vesqor]
  # Run the gate regression tests on pull requests too: with the branch
  # ruleset requiring a PR, the test must be able to FAIL the PR before the
  # merge — otherwise a regression is only caught after it is already on the
  # deploy branch. PRs only run the test job (no deploy).
  pull_request:
    branches: [vesqor, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # VESQOR: gate regression tests. These FAIL the build if the signup
      # gates (US-only geo gate, embryo sanctions gate) or the alembic graph
      # regress — the exact failure that silently shipped during the v0.11.1
      # force-push. Runs before the build so a broken gate never deploys.
      - name: Signup gate regression tests
        run: python3 test/test_vesqor_signup_gates.py

      # VESQOR: the other two dependency-free gate scripts. Like the one above
      # they use only the standard library (they assert on source and on the
      # alembic graph), so they need no Python setup and cost seconds.
      # test_vq25_page_wiring.py guards the answer-comparison page's wiring:
      # the admin tab, its i18n keys, that model output is never rendered as
      # raw HTML, and that card state is only written through its module.
      - name: Seal UI regression tests
        run: python3 test/test_vesqor_seal_ui.py

      - name: Answer-comparison page wiring tests
        run: python3 test/test_vq25_page_wiring.py

      # Guards the consent gate (GA4 must stay denied until the visitor
      # accepts) and that every /static asset referenced by src/app.html
      # actually ships in the image. vq25.css was referenced but absent from
      # static/static, so the production image served 404 for it.
      - name: Consent + static asset gate tests
        run: python3 test/test_vesqor_consent_and_static.py

      # Guards the three assistant presets: public read grants (a grantless
      # workspace model is invisible to non-admin roles), a provider-served
      # fallback base model id, and no vendor impersonation in the prompts.
      - name: Three-assistant preset gate tests
        run: python3 test/test_vesqor_three_assistants.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # VESQOR: the frontend unit tests previously ran NOWHERE. `vite build`
      # only proves the code compiles, so a logic regression in the
      # answer-comparison card state (e.g. offering a provider as a judge when
      # it cannot be one) shipped with a green build. Runs before the build to
      # fail fast, and on pull_request too, so a regression is caught before it
      # reaches the deploy branch.
      - name: Frontend unit tests
        run: npm run test:frontend

      - name: Build frontend (no pyodide)
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npx vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vesqor-webui-build
          path: build/
          retention-days: 3

      # The Dockerfile copies the pre-built build/ into the image (vite build
      # OOMs on Fly's build machines). build/ is gitignored but present in the
      # checkout from the build step above — fly deploy uses local files, so
      # the Dockerfile's `COPY build /app/build` picks it up directly.
      - name: Install flyctl
        if: github.event_name == 'push'
        run: |
          curl -sL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deploy to Fly.io (vesqor-chat)
        if: github.event_name == 'push'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -a vesqor-chat --remote-only

  deploy-gateway:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vesqor-core
        uses: actions/checkout@v4
        with:
          repository: VESQOR-MEGA-AI/vesqor-core
          ref: main
          token: ${{ secrets.VESQOR_CORE_PAT }}
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      # CICD-01 (landed in PR #33) + VQA-302-T2 (this PR): capture the resolved
      # commit ONCE, at deploy time, from the checked-out tree — never
      # ${{ github.sha }} (open-webui's own commit) and never the moving
      # `ref: main` itself. Both the deploy and its health check read this same
      # value, so "what was built" and "what is serving" cannot disagree.
      - name: Resolve vesqor-core provenance
        run: |
          SHA=$(git rev-parse HEAD)
          echo "CORE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "TRIGGER_EVENT=$GITHUB_EVENT_NAME" >> "$GITHUB_ENV"
      # VQA-202 (relanded 2026-09-26 from PR #25): SINGLE AUTHORITATIVE SSO AUDIENCE CONTRACT.
      #
      # The accepted Teams SSO audience is owned by VESQOR-MEGA-AI/vesqor-core:
      #   apps/vesqor-m365-gateway/src/config.ts   (CSV allow-list, fail-closed)
      #   apps/vesqor-m365-gateway/.env.example    (declares the contract)
      #   .github/workflows/deploy-gateway.yml     (sets the Fly secret)
      #
      # This repository is a CONSUMER. It used to write that Fly secret itself,
      # with a single hard-coded `api://` spelling, on every push to `vesqor` —
      # NARROWING the gateway's accepted audience below the authoritative CSV
      # allow-list and silently re-breaking enterprise Teams sign-in even when
      # vesqor-core was correct. Two sources of truth for one contract.
      - name: Guard — SSO audience is not the consumer's to set
        run: |
          set -euo pipefail
          VAR='ENTRA_EXPECTED_AUDIENCE'
          hits=$(grep -rnE "${VAR}[[:space:]]*=" .github scripts 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::${VAR} is hard-coded in this repository."
            echo "$hits"
            echo "Own it in vesqor-core (deploy-gateway.yml). This repo must not set it."
            exit 1
          fi
          echo "OK: ${VAR} is not set by this repository."
      - name: Deploy gateway
        working-directory: apps/vesqor-m365-gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "==> deploying vesqor-core@$CORE_SHA"
          # Two independent provenance channels, both deliberately set here:
          #
          # 1. build-arg GIT_SHA -> Dockerfile ARG -> ENV -> /health gitSha.
          #    The gateway's Dockerfile already plumbs this; only the value was
          #    missing.
          # 2. the image's GH_* labels, read with `flyctl image show`. These are
          #    NOT ours to set: flyctl injects them from GITHUB_REPOSITORY /
          #    GITHUB_SHA whenever GITHUB_ACTIONS is truthy
          #    (internal/command/deploy/deploy_build.go — labels["GH_SHA"] and
          #    labels["GH_REPO"] are assigned from env.GitCommitSHA() /
          #    env.GitRepoAndOwner(), and env.IS_GH_ACTION() is
          #    IsTruthy("GITHUB_ACTIONS")). It does this AFTER parsing --label,
          #    so `--label GH_REPO=...` is silently OVERWRITTEN. GitHub itself
          #    forbids redefining GITHUB_* (they cannot be shadowed per-step), so
          #    there is no way to correct them by assignment.
          #
          #    Unsetting GITHUB_ACTIONS makes flyctl take its non-Actions path, so
          #    --label survives. This skips ALL FOUR injected labels, so all four
          #    are supplied here explicitly rather than losing two. Nothing else
          #    depends on it: IS_CI() uses IsSet() over a list of CI markers and
          #    the runner's own `CI=true` still satisfies it
          #    (internal/env/env.go), so builder selection is unchanged. The only
          #    other reader is flyctl's error-annotation formatting
          #    (internal/cli/cli.go), which by definition no longer applies.
          env -u GITHUB_ACTIONS -u GITHUB_REPOSITORY -u GITHUB_SHA -u GITHUB_EVENT_NAME \
            flyctl deploy --remote-only --strategy rolling \
              --build-arg "GIT_SHA=$CORE_SHA" \
              --label "GH_REPO=VESQOR-MEGA-AI/vesqor-core" \
              --label "GH_SHA=$CORE_SHA" \
              --label "GH_EVENT_NAME=$TRIGGER_EVENT" \
              --label "GH_ACTION_NAME=$GITHUB_RUN_ID"

      - name: Health check (gateway)
        run: |
          # CICD-01: a 200 from an OLD machine proves nothing during a rolling
          # deploy — require the health body to report THIS vesqor-core commit.
          for i in $(seq 1 12); do
            BODY=$(curl -s "https://vesqor-m365-gateway.fly.dev/health" || true)
            if printf '%s' "$BODY" | grep -q "\"gitSha\":\"$CORE_SHA\""; then
              echo "health OK: gateway is serving $CORE_SHA"
              exit 0
            fi
            echo "attempt $i: not yet serving $CORE_SHA (health: ${BODY:0:120})"
            sleep 10
          done
          echo "::error::health check failed after 120s"
          exit 1

  deploy-brain:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vesqor-core
        uses: actions/checkout@v4
        with:
          repository: VESQOR-MEGA-AI/vesqor-core
          ref: main
          token: ${{ secrets.VESQOR_CORE_PAT }}
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      # CICD-01 (landed in PR #33) + VQA-302-T2 (this PR): see the deploy-gateway
      # job — capture the resolved commit once, from the checked-out tree, and
      # use the SAME value for the deploy and its health check.
      - name: Resolve vesqor-core provenance
        id: prov
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "CORE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "TRIGGER_EVENT=$GITHUB_EVENT_NAME" >> "$GITHUB_ENV"
      - name: Set brain notify env secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NOTIFY_SECRET: ${{ secrets.M365_GATEWAY_NOTIFY_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GA4_SECRET: ${{ secrets.GA4_API_SECRET }}
        run: |
          flyctl secrets set \
            M365_GATEWAY_NOTIFY_URL=https://vesqor-m365-gateway.fly.dev/api/notify \
            M365_GATEWAY_NOTIFY_SECRET="$NOTIFY_SECRET" \
            TELEGRAM_BOT_TOKEN="$TG_BOT_TOKEN" \
            TELEGRAM_CHAT_ID="$TG_CHAT_ID" \
            GA4_API_SECRET="$GA4_SECRET" \
            -a vesqor-brain

      - name: Deploy brain
        working-directory: apps/vesqor-mega-ai
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # VQA-302-T2 (provenance truth). This is the job that produced
          # gitSha="unknown": the brain's Dockerfile already plumbed
          # ARG GIT_SHA -> ENV GIT_SHA and app/api/health/route.ts already
          # reported it — the value was simply never supplied on this deploy
          # path. Supplying it is the whole fix. Same label reasoning as the
          # gateway job above.
          echo "==> deploying vesqor-core@$CORE_SHA"
          env -u GITHUB_ACTIONS -u GITHUB_REPOSITORY -u GITHUB_SHA -u GITHUB_EVENT_NAME \
            flyctl deploy -a vesqor-brain --remote-only --strategy rolling \
              --build-arg "GIT_SHA=$CORE_SHA" \
              --label "GH_REPO=VESQOR-MEGA-AI/vesqor-core" \
              --label "GH_SHA=$CORE_SHA" \
              --label "GH_EVENT_NAME=$TRIGGER_EVENT" \
              --label "GH_ACTION_NAME=$GITHUB_RUN_ID"

      - name: Health check (brain)
        run: |
          # Old machines answer /api/health during a rolling deploy, so a bare
          # 200 proves nothing — poll until the reported gitSha IS the commit
          # just deployed (same discipline as apps/vesqor-mega-ai/deploy/deploy-brain.sh).
          for i in $(seq 1 24); do
            BODY=$(curl -sf https://api.vesqorai.com/api/health || true)
            if printf '%s' "$BODY" | grep -q "\"gitSha\":\"$CORE_SHA\""; then
              echo "$BODY"
              echo " — brain OK, running $CORE_SHA"
              exit 0
            fi
            echo "attempt $i: not yet serving $CORE_SHA"
            sleep 5
          done
          echo "::error::health check failed: /api/health never reported gitSha=$CORE_SHA"
          exit 1

  gateway-logs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fetch gateway logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl logs -a vesqor-m365-gateway --no-tail
