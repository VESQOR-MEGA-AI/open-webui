name: deploy-gateway-via-ow
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vesqor-core
        uses: actions/checkout@v4
        with:
          repository: VESQOR-MEGA-AI/vesqor-core
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy gateway
        working-directory: apps/vesqor-m365-gateway
        run: |
          flyctl deploy --remote-only --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
