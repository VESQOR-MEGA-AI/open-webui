# ─────────────────────────────────────────────────────────────────────────────
# Backend CI — Python formatting checks via Ruff
# Runs on pushes and PRs to main/dev when backend files change
#
# VQA-307 (2026-09-21): the branch list was MISSING `vesqor`. `main` in this fork
# is pristine upstream (256 .py files, zero VESQOR customisation), so this
# workflow could only ever check code that never ships — while the 49 customised
# Python files that DO ship live only on `vesqor`. That is why the Python quality
# signal was absent on the product line. `vesqor` is now covered; no requirement
# was relaxed, skipped or removed. See the PR body for the measurements, the AST
# equivalence proof and the fault-injection negative controls.
# ─────────────────────────────────────────────────────────────────────────────
name: Python CI

on:
  push:
    branches: [main, dev, vesqor]
    paths: ['backend/**', 'pyproject.toml', 'uv.lock', '.github/workflows/backend.yaml']
  pull_request:
    branches: [main, dev, vesqor]
    paths: ['backend/**', 'pyproject.toml', 'uv.lock', '.github/workflows/backend.yaml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Ruff format check across supported Python versions ───────────────────
  format-check:
    name: Ruff Format (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install formatter
        run: pip install "ruff>=0.15.5"

      - name: Verify formatting
        run: ruff format --check . --exclude .venv --exclude venv

      - name: Detect logic errors
        run: ruff check --select=F --ignore=F401,F403,F405,F541,F811,F841 --output-format=github .
