app = "vesqor-chat"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "chat_data"
  destination = "/app/backend/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
