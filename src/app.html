		<!-- Google Analytics 4 — Chat stream G-NRF1DRN448 (2026-09-05) -->
		<script>
			// gtag is defined on window (NOT inside an IIFE): the consent banner
			// further down the document must be able to emit a consent 'update',
			// and it cannot reach a function scoped to this closure.
			window.dataLayer = window.dataLayer || [];
			window.gtag = function gtag() {
				dataLayer.push(arguments);
			};
			(function () {
				var id = 'G-NRF1DRN448';
				if (!id) return;
				// Consent Mode v2: analytics denied until the visitor accepts
				// via the cookie banner (see #consent-banner in body).
				gtag('consent', 'default', {
					ad_storage: 'denied',
					analytics_storage: 'denied',
					functionality_storage: 'granted',
					personalization_storage: 'denied',
					security_storage: 'granted',
					wait_for_update: 500
				});
				gtag('js', new Date());
				gtag('config', id, { send_page_view: true });
				var s = document.createElement('script');
				s.async = true;
				s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(id);
				document.head.appendChild(s);
			})();
		</script>

		<script>
			function resizeIframe(obj) {
				obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
			}
		</script>

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme || localStorage.theme === 'system') {
					// VESQOR default skin is dark (Navy/Black/Emerald custom.css).
					// 'system' was the old default — migrate it to the VESQOR skin
					// so every user sees the branded theme unless they explicitly
					// picked light/oled/her.
					localStorage.theme = 'dark';
				}

				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
				} else if (localStorage.theme === 'oled-dark') {
					document.documentElement.style.setProperty('--color-gray-800', '#101010');
					document.documentElement.style.setProperty('--color-gray-850', '#050505');
					document.documentElement.style.setProperty('--color-gray-900', '#000000');
					document.documentElement.style.setProperty('--color-gray-950', '#000000');
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#000000');
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');
				} else if (localStorage.theme === 'her') {
					document.documentElement.classList.add('her');
					metaThemeColorTag.setAttribute('content', '#983724');
				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#020914');
				}

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#020914');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
					}
				});
			})();
		</script>

		<title>VESQOR MEGA AI</title>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<script>
		// VESQOR living-background states.
		// TWO independent flags (owner 2026-09-14: дождь стоит на паузе, пока
		// работаем с чатом; после 2 минут бездействия рейн продолжает):
		//   body.vesqor-active       — ЛЮБАЯ активность (клик, скролл, клавиша,
		//                               фокус во ввод). Ставит дождь на паузу.
		//                               Снимается через 2 минуты бездействия.
		//   body.vesqor-interacting  — реальный ввод (печать/фокус в input,
		//                               textarea, contenteditable). Включает
		//                               матовое стекло. Снимается через 6с.
		(function () {
			var body = document.body;
			var activeTimer = null;
			var glassTimer = null;
			var ACTIVE_RESET_MS = 120000; // 2 мин без активности → рейн оживает
			var GLASS_RESET_MS = 6000; // матовое стекло гаснет через 6с после ввода

			function isRealInput(el) {
				if (!el || el === document.body) return false;
				if (el.isContentEditable) return true;
				var t = el.tagName;
				if (t === 'TEXTAREA' || t === 'INPUT' || t === 'SELECT') return true;
				return false;
			}
			function setActive(on) {
				if (on) {
					body.classList.add('vesqor-active');
					clearTimeout(activeTimer);
					activeTimer = setTimeout(function () { setActive(false); }, ACTIVE_RESET_MS);
				} else {
					body.classList.remove('vesqor-active');
				}
			}
			function setInteracting(on) {
				if (on) {
					body.classList.add('vesqor-interacting');
					clearTimeout(glassTimer);
					glassTimer = setTimeout(function () { setInteracting(false); }, GLASS_RESET_MS);
				} else {
					body.classList.remove('vesqor-interacting');
				}
			}
			function onActivity(e) {
				setActive(true);
				if (isRealInput(e.target)) setInteracting(true);
			}
			// ЛЮБАЯ физическая активность ставит дождь на паузу (active).
			document.addEventListener('pointerdown', onActivity, true);
			document.addEventListener('keydown', onActivity, true);
			document.addEventListener('wheel', function () { setActive(true); }, { passive: true, capture: true });
			document.addEventListener('touchstart', onActivity, { passive: true, capture: true });
			// Реальный ввод (фокус в поле) — матовое стекло (interacting).
			document.addEventListener('focusin', function (e) {
				if (isRealInput(e.target)) setInteracting(true);
			}, true);
			window.addEventListener('blur', function () {
				setInteracting(false);
				setActive(false);
			});
			document.addEventListener('focusout', function (e) {
				var next = e.relatedTarget;
				if (!next) {
					requestAnimationFrame(function () {
						var active = document.activeElement;
						if (!active || active === document.body || !body.contains(active) || !isRealInput(active)) {
							setInteracting(false);
						}
					});
				}
			});
		})();
		</script>

		<!-- Cookie consent banner (GDPR) — analytics stay denied until the
		     visitor explicitly accepts (Consent Mode v2). -->
		<div id="consent-banner" style="display: none; position: fixed; bottom: 1rem; left: 1rem; right: 1rem; z-index: 9999; max-width: 36rem; margin: 0 auto; background: #171717; border: 1px solid rgba(255,255,255,0.15); border-radius: 0.75rem; padding: 1rem 1.25rem; box-shadow: 0 8px 30px rgba(0,0,0,0.5); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #e5e5e5; font-size: 0.875rem; line-height: 1.5;">
			<p style="margin: 0 0 0.75rem;">
				We use cookies to understand how visitors use this site and to improve the product.
				Analytics are only enabled with your consent.
			</p>
			<div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
				<button id="consent-accept" style="background: #10a37f; color: #fff; border: none; border-radius: 0.5rem; padding: 0.5rem 1rem; font-size: 0.875rem; cursor: pointer;">Accept</button>
				<button id="consent-decline" style="background: transparent; color: #e5e5e5; border: 1px solid rgba(255,255,255,0.3); border-radius: 0.5rem; padding: 0.5rem 1rem; font-size: 0.875rem; cursor: pointer;">Decline</button>
			</div>
		</div>
		<script>
			(function () {
				var KEY = 'vesqor-consent';
				var banner = document.getElementById('consent-banner');
				if (!banner) return;
				// gtag('consent','update',{...}) is the documented form. Pushing a
				// bare {event:'consent_update', consent:{...}} dataLayer object does
				// NOT reach Consent Mode: Google Tag ignores it because the
				// 'consent' command is a gtag.js *command*, not a dataLayer event.
				// Verified live: the flat-object form left analytics_storage
				// denied (ics.usedUpdate === false) even after the visitor accepted.
				function pushConsent(analytics) {
					if (typeof window.gtag === 'function') {
						window.gtag('consent', 'update', {
							ad_storage: 'denied',
							analytics_storage: analytics,
							functionality_storage: 'granted',
							personalization_storage: 'denied',
							security_storage: 'granted'
						});
					}
				}
				var stored = null;
				try { stored = localStorage.getItem(KEY); } catch (e) {}
				if (stored === 'accepted') {
					pushConsent('granted');
				} else if (stored === 'declined') {
					pushConsent('denied');
				} else {
					banner.style.display = 'block';
				}
				document.getElementById('consent-accept').addEventListener('click', function () {
					try { localStorage.setItem(KEY, 'accepted'); } catch (e) {}
					pushConsent('granted');
					banner.style.display = 'none';
				});
				document.getElementById('consent-decline').addEventListener('click', function () {
					try { localStorage.setItem(KEY, 'declined'); } catch (e) {}
					pushConsent('denied');
					banner.style.display = 'none';
				});
			})();
		</script>

		<div style="display: contents">%sveltekit.body%</div>
	</body>
