		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme || localStorage.theme === 'system') {
					// VESQOR default skin is dark (Navy/Black/Emerald custom.css).
					// 'system' was the old default — migrate it to the VESQOR skin
					// so every user sees the branded theme unless they explicitly
					// picked light/oled/her.
					localStorage.theme = 'dark';
				}

				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
				} else if (localStorage.theme === 'oled-dark') {
					document.documentElement.style.setProperty('--color-gray-800', '#101010');
					document.documentElement.style.setProperty('--color-gray-850', '#050505');
					document.documentElement.style.setProperty('--color-gray-900', '#000000');
					document.documentElement.style.setProperty('--color-gray-950', '#000000');
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#000000');
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');
				} else if (localStorage.theme === 'her') {
					document.documentElement.classList.add('her');
					metaThemeColorTag.setAttribute('content', '#983724');
				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#020914');
				}

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#020914');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
					}
				});
			})();
		</script>

		<title>VESQOR MEGA AI</title>

	</head>

	<body data-sveltekit-preload-data="hover">
		<!-- VESQOR ambient living background — identical to vesqorai.com landing:

		<div class="ambient-bg" aria-hidden>

			<div class="ambient-particle ambient-particle--5"></div>
			<div class="ambient-particle ambient-particle--6"></div>
			<div class="ambient-particle ambient-particle--7"></div>
			<div class="ambient-particle ambient-particle--8"></div>
			</div>
			<script>
			// VESQOR living-background states (owner 2026-09-10):
			//   idle            — matrix alive, glass clear (0.45)
			//   interacting     — user focused/typing/clicked → matrix paused,
			//                     glass matte (~95%). Removed when focus leaves
			//                     the app (blur) or input blur fires.
			//   report-open     — set by ReportView.svelte when a report is fully
			//                     rendered (done=true): matrix paused + matte.
			(function () {
				var body = document.body;
				var idleTimer = null;
				// Idle timeout: after the last input interaction, return to the
				// living state (matrix resumes). The tint applies ONLY while the
				// user is actually focused in an input field — NOT on any click.
				// Tapping a message, the background, or a button must not pause
				// the matrix or tint glass (owner 2026-09-11: "click on anything
				// and it looks broken" — a stray tap froze the whole UI matte).
				var IDLE_RESET_MS = 6000;
				function isRealInput(el) {
					if (!el || el === document.body) return false;
					if (el.isContentEditable) return true;
					var t = el.tagName;
					if (t === 'TEXTAREA' || t === 'INPUT' || t === 'SELECT') return true;
					return false;
				}
				function setInteracting(on) {
					if (on) {
						body.classList.add('vesqor-interacting');
						clearTimeout(idleTimer);
						idleTimer = setTimeout(function () {
							setInteracting(false);
						}, IDLE_RESET_MS);
					} else {
						clearTimeout(idleTimer);
						idleTimer = null;
						body.classList.remove('vesqor-interacting');
					}
				}
				// Only real keyboard input (focus in a field / typing) tints the
				// glass: the composer, search boxes, settings inputs. Random taps
				// anywhere else keep the matrix alive and glass clear.
				document.addEventListener('focusin', function (e) {
					if (isRealInput(e.target)) setInteracting(true);
				}, true);
				document.addEventListener('keydown', function (e) {
					if (isRealInput(e.target)) setInteracting(true);
				}, true);
				// Focus moved outside the document root → back to idle (matrix
				// resumes, glass clears). Blur with no replacement target.
				window.addEventListener('blur', function () {
					setInteracting(false);
				});
				// Leaving the last input → idle (allows focus jumps between
				// fields). After SPA navigation activeElement can be <body>
				// itself — exclude body, otherwise the tint would stick forever.
				document.addEventListener('focusout', function (e) {
					var next = e.relatedTarget;
					if (!next) {
						requestAnimationFrame(function () {
							var active = document.activeElement;
							if (!active || active === document.body || !body.contains(active) || !isRealInput(active)) {
								setInteracting(false);
							}
						});
					}
				});
			})();
			</script>
			<div style="display: contents">%sveltekit.body%</div>
	</body>
